# .github/workflows/firebase_app_distribution.yml
# SSW3401: Unified CI/CD Pipeline (Automated Testing, Quality Checks & Firebase App Distribution)
name: Flutter CI/CD & Firebase App Distribution

on:
  push:
    branches: [ main ]

jobs:
  ci_cd_pipeline:
    name: Flutter CI (Code Checks & Tests) & CD (Firebase App Distribution)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 required by modern Android Gradle & Flutter builds
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Flutter Environment
      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Verify environment setup
      - name: Verify Flutter Installation
        run: flutter doctor -v

      # Step 5: Install project dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 6: Static code analysis (Code Quality Check)
      - name: Static Code Analysis (flutter analyze)
        run: flutter analyze

      # Step 7: Automated unit & widget tests (CI Gate - MUST pass before build/deploy)
      - name: Run Automated Tests (CI Gate)
        run: flutter test

      # Step 8: Build release APK (Only on push to main or master if tests pass)
      - name: Build Production Release APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: flutter build apk --release

      # Step 9: Save APK as GitHub Actions artifact (Downloadable from summary)
      - name: Upload APK to GitHub Artifacts
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # Step 10: Distribute to testers via Firebase App Distribution
      - name: Upload to Firebase App Distribution
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups "testers" --release-notes "Build #${{ github.run_number }} (${{ github.sha }}) - Verified by CI tests"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
